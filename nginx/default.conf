server {
    listen 8080;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Expose metrics for Prometheus Exporter
    location /metrics {
        stub_status on;
        access_log off;
        allow all; 
    }
}
